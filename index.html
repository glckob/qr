<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KH-QR Code Generator</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code Library -->
    <script src="./qrcode.min.js"></script>
    <style>
        .checkered-bg {
            background-image: 
                linear-gradient(45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(-45deg, #f0f0f0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #f0f0f0 75%),
                linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen bg-white text-neutral-800 p-4 md:p-8 font-sans">
    <img src="./khflag.png" alt="Flag" class="fixed top-4 left-4 w-48 h-48 object-cover z-50" />
    <img src="./nv logo.png" alt="Logo" class="fixed bottom-4 left-4 w-40 h-40 object-contain z-50" />
    
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center md:text-left flex items-center justify-center md:justify-start gap-3">
            <div class="bg-blue-600 p-3 rounded-xl shadow-sm">
                <!-- QR Code Icon -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 text-white"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
            </div>
            <div>
                <h1 class="text-3xl font-bold text-neutral-900 tracking-tight">KH-QR Code Creator</h1>
                <p class="text-neutral-500 font-medium">Free-Easy QR Code Generator, customize, download!</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Section 1: Controls Section -->
            <div class="lg:col-span-5 space-y-6">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200">
                    
                    <!-- Input Area -->
                    <div class="space-y-3">
                        <label class="flex items-center gap-2 text-sm font-semibold text-neutral-700">
                            <!-- Type Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-blue-500"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/></svg>
                            Text or URL
                        </label>
                        <textarea
                            id="textInput"
                            placeholder="https://... or type any text here"
                            class="w-full min-h-[120px] p-4 bg-neutral-50 border border-neutral-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all resize-y text-neutral-800 placeholder-neutral-400"
                        >https://example.com</textarea>
                        
                        <!-- Generate Button -->
                        <button type="button" id="btnGenerate" class="w-full py-3 px-4 bg-neutral-800 hover:bg-neutral-900 text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm active:scale-[0.98]">
                            <!-- Refresh/Generate Icon -->
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                            Generate QR Code
                        </button>
                    </div>

                    <hr class="my-6 border-neutral-100" />

                    <!-- Customization Options -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        
                        <!-- Background Toggle -->
                        <div class="space-y-3">
                            <label class="flex items-center gap-2 text-sm font-semibold text-neutral-700">
                                <!-- Palette Icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-blue-500"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>
                                Background
                            </label>
                            <div class="flex bg-neutral-100 p-1 rounded-xl">
                                <button id="btnWhite" class="flex-1 py-2 px-3 text-sm font-medium rounded-lg transition-all bg-white shadow-sm text-neutral-900">
                                    Solid White
                                </button>
                                <button id="btnTrans" class="flex-1 py-2 px-3 text-sm font-medium rounded-lg transition-all text-neutral-500 hover:text-neutral-700">
                                    Transparent
                                </button>
                            </div>
                        </div>

                        <!-- Background Color -->
                        <div class="space-y-3">
                            <label class="flex items-center gap-2 text-sm font-semibold text-neutral-700">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-blue-500"><path d="M12 3v18"/><path d="M3 12h18"/></svg>
                                Background Color
                            </label>
                            <div class="flex items-center gap-3 bg-neutral-50 border border-neutral-200 rounded-xl px-4 py-3">
                                <input id="bgColorInput" type="color" value="#ffffff" class="h-10 w-10 p-0 border-0 bg-transparent" />
                                <span id="bgColorText" class="text-sm font-medium text-neutral-700">#ffffff</span>
                            </div>
                            <p class="text-xs text-neutral-500">Used when Background is Solid White.</p>
                        </div>

                        <!-- Format Selector -->
                        <div class="space-y-3">
                            <label class="flex items-center gap-2 text-sm font-semibold text-neutral-700">
                                <!-- Image Icon -->
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-blue-500"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                                File Format
                            </label>
                            <div class="flex bg-neutral-100 p-1 rounded-xl">
                                <button id="btnPng" class="flex-1 py-2 px-2 text-sm font-medium uppercase rounded-lg transition-all bg-white shadow-sm text-neutral-900">PNG</button>
                                <button id="btnSvg" class="flex-1 py-2 px-2 text-sm font-medium uppercase rounded-lg transition-all text-neutral-500 hover:text-neutral-700">SVG</button>
                                <button id="btnWebp" class="flex-1 py-2 px-2 text-sm font-medium uppercase rounded-lg transition-all text-neutral-500 hover:text-neutral-700">WEBP</button>
                            </div>
                        </div>

                    </div>

                </div>
            </div>

            <!-- Section 2: Preview Section -->
            <div class="lg:col-span-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200 sticky top-6 flex flex-col items-center">
                    
                    <h2 class="text-lg font-bold text-neutral-800 mb-6 w-full text-center">Live Preview</h2>
                    
                    <!-- Image Preview Area with Checkered Background for Transparency -->
                    <div class="checkered-bg w-full max-w-[300px] aspect-square rounded-2xl flex items-center justify-center border border-neutral-200 overflow-hidden relative">
                        <img id="previewImg" src="" alt="Generated QR Code" class="w-full h-full object-contain p-2 hidden transition-opacity duration-300" />
                        <span id="emptyText" class="text-neutral-400 text-sm">Enter text to generate</span>
                    </div>

                    <!-- Download Button -->
                    <button
                        id="downloadBtn"
                        disabled
                        class="mt-8 w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 disabled:bg-neutral-300 disabled:cursor-not-allowed text-white font-semibold rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm hover:shadow active:scale-[0.98]"
                    >
                        <!-- Download Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        Download <span id="downloadFormatText">PNG</span>
                    </button>
                    
                    <div class="mt-4 flex items-center justify-center gap-2 text-xs text-neutral-500">
                        <!-- Check Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 text-green-500"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
                        Ready for high-quality printing & digital use
                    </div>
                </div>
            </div>

            <!-- Section 3: Stats / Flag Counter Section -->
            <div class="lg:col-span-3">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-neutral-200 sticky top-6 flex flex-col items-center">
                    <h2 class="text-lg font-bold text-neutral-800 mb-6 w-full text-center">Visitor Stats</h2>
                    
                    <!-- Flag Counter -->
                    <a href="https://info.flagcounter.com/yQvo" target="_blank" class="hover:scale-105 transition-transform duration-200 w-full flex justify-center">
                        <img src="https://s01.flagcounter.com/count2/yQvo/bg_FFFFFF/txt_000000/border_CCCCCC/columns_2/maxflags_10/viewers_0/labels_1/pageviews_1/flags_0/percent_0/" alt="Flag Counter" border="0" class="rounded shadow-sm border border-neutral-100 w-full">
                    </a>
                </div>
            </div>

        </div>
    </div>

    <!-- Application Logic -->
    <script>
        const state = {
            text: 'https://example.com',
            format: 'png',
            isTransparent: false,
            bgColor: '#ffffff',
            qrUrl: ''
        };

        const els = {
            textInput: document.getElementById('textInput'),
            btnGenerate: document.getElementById('btnGenerate'),
            btnWhite: document.getElementById('btnWhite'),
            btnTrans: document.getElementById('btnTrans'),
            bgColorInput: document.getElementById('bgColorInput'),
            bgColorText: document.getElementById('bgColorText'),
            btnPng: document.getElementById('btnPng'),
            btnSvg: document.getElementById('btnSvg'),
            btnWebp: document.getElementById('btnWebp'),
            previewImg: document.getElementById('previewImg'),
            emptyText: document.getElementById('emptyText'),
            downloadBtn: document.getElementById('downloadBtn'),
            downloadFormatText: document.getElementById('downloadFormatText')
        };

        const loadImage = (src) => new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = (e) => reject(e);
            img.src = src;
        });

        // UI Handlers
        const updateBgButtons = () => {
            const activeClass = "flex-1 py-2 px-3 text-sm font-medium rounded-lg transition-all bg-white shadow-sm text-neutral-900";
            const inactiveClass = "flex-1 py-2 px-3 text-sm font-medium rounded-lg transition-all text-neutral-500 hover:text-neutral-700";
            
            els.btnWhite.className = !state.isTransparent ? activeClass : inactiveClass;
            els.btnTrans.className = state.isTransparent ? activeClass : inactiveClass;
        };

        const updateFormatButtons = () => {
            const activeClass = "flex-1 py-2 px-2 text-sm font-medium uppercase rounded-lg transition-all bg-white shadow-sm text-neutral-900";
            const inactiveClass = "flex-1 py-2 px-2 text-sm font-medium uppercase rounded-lg transition-all text-neutral-500 hover:text-neutral-700";

            ['png', 'svg', 'webp'].forEach(fmt => {
                const btn = els['btn' + fmt.charAt(0).toUpperCase() + fmt.slice(1)];
                btn.className = (state.format === fmt) ? activeClass : inactiveClass;
            });
            els.downloadFormatText.innerText = state.format.toUpperCase();
        };

        // Event Listeners
        els.textInput.addEventListener('input', (e) => {
            state.text = e.target.value;
        });

        els.bgColorInput.addEventListener('input', (e) => {
            state.bgColor = e.target.value;
            els.bgColorText.innerText = (state.bgColor || '').toLowerCase();
            if (state.isTransparent) {
                state.isTransparent = false;
                updateBgButtons();
            }
            generateQR();
        });

        els.btnGenerate.addEventListener('click', () => {
            // Force sync the text right when clicked to guarantee we have the latest input
            state.text = els.textInput.value;
            generateQR();
        });

        els.btnWhite.addEventListener('click', () => { state.isTransparent = false; updateBgButtons(); generateQR(); });
        els.btnTrans.addEventListener('click', () => { state.isTransparent = true; updateBgButtons(); generateQR(); });

        ['png', 'svg', 'webp'].forEach(fmt => {
            els['btn' + fmt.charAt(0).toUpperCase() + fmt.slice(1)].addEventListener('click', () => {
                state.format = fmt;
                updateFormatButtons();
                generateQR();
            });
        });

        els.downloadBtn.addEventListener('click', () => {
            if (!state.qrUrl) return;
            const a = document.createElement('a');
            a.href = state.qrUrl;
            a.download = `qrcode-download.${state.format}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Generation Logic
        const generateQR = async () => {
            if (!window.QRCode) {
                els.previewImg.classList.add('hidden');
                els.emptyText.classList.remove('hidden');
                els.emptyText.innerText = 'QR library failed to load. Check your internet / CDN access and reload.';
                els.downloadBtn.disabled = true;
                return;
            }

            const hasModernApi = (typeof window.QRCode.toDataURL === 'function') && (typeof window.QRCode.toString === 'function');
            const hasConstructorApi = (typeof window.QRCode === 'function') && !hasModernApi;

            // Always ensure we are using the absolute latest text from the input box
            state.text = els.textInput.value;

            if (!state.text.trim()) {
                els.previewImg.classList.add('hidden');
                els.emptyText.classList.remove('hidden');
                els.emptyText.innerText = 'Enter text to generate';
                els.downloadBtn.disabled = true;
                return;
            }

            // Visual feedback: dim the image briefly so the user knows it's regenerating
            els.previewImg.style.opacity = '0.4';

            try {
                const colorLight = state.isTransparent ? 'rgba(0,0,0,0)' : (state.bgColor || '#ffffff');
                const colorDark = '#000000';

                if (hasModernApi) {
                    if (state.format === 'svg') {
                        const svgString = await QRCode.toString(state.text, {
                            type: 'svg',
                            width: 400,
                            margin: 2,
                            color: { dark: colorDark, light: colorLight }
                        });
                        const blob = new Blob([svgString], { type: 'image/svg+xml' });
                        state.qrUrl = URL.createObjectURL(blob);
                    } else {
                        state.qrUrl = await QRCode.toDataURL(state.text, {
                            type: `image/${state.format}`,
                            width: 400,
                            margin: 2,
                            color: { dark: colorDark, light: colorLight }
                        });
                    }
                } else if (hasConstructorApi) {
                    if (state.format === 'svg') {
                        throw new Error('This qrcode.min.js build does not support SVG output. Please switch to PNG/WEBP.');
                    }

                    const tmp = document.createElement('div');
                    tmp.style.position = 'fixed';
                    tmp.style.left = '-10000px';
                    tmp.style.top = '-10000px';
                    document.body.appendChild(tmp);

                    tmp.innerHTML = '';
                    new QRCode(tmp, {
                        text: state.text,
                        width: 400,
                        height: 400,
                        colorDark: colorDark,
                        colorLight: state.isTransparent ? 'rgba(0,0,0,0)' : (state.bgColor || '#ffffff')
                    });

                    const canvas = tmp.querySelector('canvas');
                    const img = tmp.querySelector('img');

                    if (canvas) {
                        const mime = (state.format === 'webp') ? 'image/webp' : 'image/png';
                        state.qrUrl = canvas.toDataURL(mime);
                    } else if (img && img.src) {
                        state.qrUrl = img.src;
                    } else {
                        throw new Error('QR library rendered no canvas/image.');
                    }

                    document.body.removeChild(tmp);
                } else {
                    throw new Error('Unsupported QRCode library detected.');
                }
                
                els.previewImg.src = state.qrUrl;
                els.previewImg.classList.remove('hidden');
                els.emptyText.classList.add('hidden');
                els.downloadBtn.disabled = false;
            } catch (err) {
                console.error('QR Generation Error:', err);
                els.previewImg.classList.add('hidden');
                els.emptyText.classList.remove('hidden');
                els.emptyText.innerText = `Could not generate QR code: ${err && err.message ? err.message : err}`;
                els.downloadBtn.disabled = true;
            } finally {
                // Restore full opacity after generation
                setTimeout(() => {
                    els.previewImg.style.opacity = '1';
                }, 150);
            }
        };

        // Wait for library to load before first generation
        const initCheck = setInterval(() => {
            if (window.QRCode) {
                clearInterval(initCheck);
                updateBgButtons();
                updateFormatButtons();
                els.bgColorInput.value = state.bgColor;
                els.bgColorText.innerText = (state.bgColor || '').toLowerCase();
                generateQR();
            }
        }, 100);

    </script>
</body>
</html>
